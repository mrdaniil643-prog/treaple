# Render Blueprint: сайт выкладывается из GitHub при каждом обновлении ветки.
services:
  - type: web
    name: mt-bar
    runtime: docker
    plan: starter            # диск для базы есть только на платных тарифах
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: mt-data
      mountPath: /app/data   # здесь лежит база с заказами — она переживает перезапуски
      sizeGB: 1
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true  # пароль админки: посмотрите его в настройках сервиса на Render
      - key: TRUST_PROXY
        value: "1"
      - key: VENUE_TZ
        value: Asia/Vladivostok  # Хабаровск
      - key: PUBLIC_ORIGIN
        sync: false          # адрес сайта, например https://mt-bar.onrender.com
      - key: DEMO_PAYMENTS
        sync: false          # 1 — тестовая оплата без денег; при подключённой ЮKassa не нужна
      - key: YOOKASSA_SHOP_ID
        sync: false          # ЮKassa → Интеграция → Ключи API: shopId
      - key: YOOKASSA_SECRET_KEY
        sync: false          # там же: секретный ключ (тестовый магазин — test_…)
      - key: YOOKASSA_VAT_CODE
        sync: false          # ставка НДС в чеке: 1 без НДС (по умолчанию), 7 — 5%, 8 — 7%, 4 — 20%
      - key: YOOKASSA_TAX_SYSTEM
        sync: false          # система налогообложения: 1 ОСН, 2 УСН доходы, 3 УСН доходы минус расходы
