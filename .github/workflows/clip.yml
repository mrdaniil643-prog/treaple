name: Clip

# Two ways in:
#   - repository_dispatch: the Telegram bot (bot/worker.js) -- the normal path
#   - workflow_dispatch: the "Run workflow" button, for running it by hand
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL"
        required: true
        type: string
      count:
        description: "How many clips"
        required: false
        default: "6"
        type: string
      language:
        description: "Transcript language (ru, en, ...); blank = autodetect"
        required: false
        default: ""
        type: string
      model:
        description: "Whisper model"
        required: false
        default: "small"
        type: choice
        options: ["tiny", "base", "small", "medium", "large-v3"]
      reframe:
        description: "Vertical framing"
        required: false
        default: "smart"
        type: choice
        options: ["smart", "center", "blur"]
      keep_artifact:
        description: "Also attach clips to the run (public on a public repo)"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [clip]

concurrency:
  group: clip-${{ github.event.client_payload.chat_id || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Answer whoever asked; fall back to the owner for manual runs.
      TELEGRAM_CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: cfg
        env:
          # github.event.* covers both trigger shapes; the `inputs` context
          # does not exist on repository_dispatch. Values travel through env
          # rather than being inlined, so nothing can break out of the shell.
          I_URL: ${{ github.event.inputs.url || github.event.client_payload.url }}
          I_FILE_ID: ${{ github.event.client_payload.file_id }}
          I_COUNT: ${{ github.event.inputs.count || github.event.client_payload.count }}
          I_LANG: ${{ github.event.inputs.language || github.event.client_payload.language }}
          I_MODEL: ${{ github.event.inputs.model || github.event.client_payload.model }}
          I_REFRAME: ${{ github.event.inputs.reframe || github.event.client_payload.reframe }}
        run: |
          set -euo pipefail
          if [ -z "${I_URL:-}" ] && [ -z "${I_FILE_ID:-}" ]; then
            echo "::error::neither a url nor a file_id was supplied"
            exit 1
          fi
          {
            echo "has_file=$([ -n "${I_FILE_ID:-}" ] && echo yes || echo no)"
            echo "count=${I_COUNT:-6}"
            echo "language=${I_LANG:-}"
            echo "model=${I_MODEL:-small}"
            echo "reframe=${I_REFRAME:-smart}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check ffmpeg
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ steps.cfg.outputs.model }}-v1

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Say hello
        run: |
          python -m clipper notify "Взялся за работу. Модель ${{ steps.cfg.outputs.model }}, клипов до ${{ steps.cfg.outputs.count }}."

      - name: Fetch the uploaded video
        id: fetch
        if: steps.cfg.outputs.has_file == 'yes'
        env:
          FILE_ID: ${{ github.event.client_payload.file_id }}
        run: |
          set -euo pipefail
          python -m clipper fetch "$FILE_ID" -o inbox/source.mp4
          echo "path=inbox/source.mp4" >> "$GITHUB_OUTPUT"

      - name: Render clips
        env:
          # Datacenter IPs get challenged by YouTube far more often than home
          # ones; cookies from a signed-in account are the reliable way past it.
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          URL: ${{ github.event.inputs.url || github.event.client_payload.url }}
          LOCAL: ${{ steps.fetch.outputs.path }}
          COUNT: ${{ steps.cfg.outputs.count }}
          LANGUAGE: ${{ steps.cfg.outputs.language }}
          MODEL: ${{ steps.cfg.outputs.model }}
          REFRAME: ${{ steps.cfg.outputs.reframe }}
        run: |
          set -euo pipefail
          source_ref="${LOCAL:-$URL}"

          args=(-m clipper run "$source_ref" -n "$COUNT" --model "$MODEL" --reframe "$REFRAME")

          # Plain `if` blocks rather than `[ x ] && args+=(...)`: an AND-list
          # whose test fails returns non-zero, which is harmless mid-script but
          # fails the step when it lands last. `if` has no such edge.
          if [ -n "${LANGUAGE:-}" ]; then
            args+=(--language "$LANGUAGE")
          fi
          if [ -n "${YOUTUBE_COOKIES:-}" ] && [ -z "${LOCAL:-}" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > cookies.txt
            args+=(--cookies cookies.txt)
            echo "using supplied cookies"
          fi

          python "${args[@]}"

      - name: Send clips
        run: |
          set -euo pipefail
          shopt -s nullglob
          sent=0
          for dir in out/*/; do
            if [ -f "${dir}clips.json" ]; then
              python -m clipper publish telegram "$dir"
              sent=1
            fi
          done
          if [ "$sent" -eq 0 ]; then
            python -m clipper notify "Клипов не вышло: ничего не прошло порог качества. Попробуйте другое видео."
          fi

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          clips=(out/*/*.mp4)
          if [ ${#clips[@]} -eq 0 ]; then
            echo "No clips produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "| clip | size |"
            echo "|---|---|"
            for f in "${clips[@]}"; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        # Without this a failed run is silence in the chat, which is the
        # worst possible outcome for someone waiting on their phone.
        if: failure()
        run: |
          python -m clipper notify "Прогон упал. Лог: $RUN_URL" || true

      - name: Attach clips to the run
        if: github.event.inputs.keep_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: out/**/*.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: Clean up
        if: always()
        run: rm -f cookies.txt
