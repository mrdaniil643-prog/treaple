name: Тесты

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - run: npm run lint
      - name: ESLint (ошибки в коде)
        run: npx --yes eslint@10.1.0 .
      - run: npm test
      - name: Сервер запускается и отвечает
        run: |
          ADMIN_TOKEN=ci-token-123456789 DB_FILE=/tmp/ci.db PORT=3000 node --no-warnings server/index.js --prod &
          for i in $(seq 20); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 0.5; done
          curl -sf http://127.0.0.1:3000/ > /dev/null
          curl -sf http://127.0.0.1:3000/api/events > /dev/null
          test -f /tmp/backups/mt-$(date -u +%F).db

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Браузер для проверок
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: npm run e2e

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - run: pip install requests==2.33.1
      - name: Атаки OWASP против временной копии
        run: |
          ADMIN_TOKEN=ci-security-token-123 DB_FILE=/tmp/sec.db BACKUP_DIR=off PORT=3000 node --no-warnings server/index.js &
          for i in $(seq 20); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 0.5; done
          ADMIN_TOKEN=ci-security-token-123 TARGET=http://127.0.0.1:3000 python3 scripts/security-check.py
