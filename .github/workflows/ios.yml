name: iOS

on:
  push:
    branches: ["claude/**", "main", "master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и скриншоты
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      BUNDLE_ID: com.treaple.inventory

    steps:
      - uses: actions/checkout@v4

      - name: Окружение
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: Доступные API оформления в SDK
        continue-on-error: true
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          DIR="$SDK/System/Library/Frameworks/SwiftUI.framework/Modules/SwiftUI.swiftmodule"
          IFACE=$(ls "$DIR"/*.swiftinterface 2>/dev/null | head -1)
          echo "sdk: $SDK"
          echo "interface: $IFACE"
          [ -n "$IFACE" ] && grep -nE "func glassEffect|GlassEffectContainer|func glassEffectID|func scrollTransition|func symbolEffect" "$IFACE" | head -20

      - name: Сборка для симулятора
        run: |
          set -o pipefail
          xcodebuild build \
            -project Treaple.xcodeproj \
            -scheme Treaple \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log

      - name: Ошибки компиляции
        if: failure()
        run: |
          echo "=== errors ==="
          grep -E "error:" build.log | sort -u | head -60 || true
          echo "=== warnings ==="
          grep -E "warning:" build.log | sort -u | head -30 || true

      - name: Запуск в симуляторе
        run: |
          set -e
          mkdir -p screenshots

          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              print([x['udid'] for rt in d for x in d[rt] if x['name'].startswith('iPhone')][0])")
          echo "simulator: $UDID"

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3

          APP=$(find build/Build/Products -maxdepth 3 -name "Treaple.app" | head -1)
          echo "app: $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -seedDemoData
          sleep 12

          # Если приложение упало на старте, скриншоты снимут домашний экран
          # симулятора и это молча уедет в репозиторий. Проверяем явно.
          CRASH=$(ls -t ~/Library/Logs/DiagnosticReports/Treaple*.ips 2>/dev/null | head -1 || true)
          if [ -n "$CRASH" ]; then
            echo "::error::Приложение упало при запуске"
            echo "=== $CRASH ==="
            head -c 6000 "$CRASH"
            echo
            echo "=== лог симулятора ==="
            xcrun simctl spawn "$UDID" log show --last 3m \
              --predicate 'processImagePath CONTAINS "Treaple"' --style compact 2>/dev/null | tail -60 || true
            exit 1
          fi

          xcrun simctl io "$UDID" screenshot screenshots/1-inventory-light.png

          # simctl openurl показывает системный диалог «Open in ...?», поэтому
          # экраны открываем перезапуском с аргументом.
          shot() {
            NAME="$1"; shift
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" > /dev/null 2>&1 || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE_ID" "$@"
            sleep 7
            xcrun simctl io "$UDID" screenshot "screenshots/$NAME"
          }

          shot 2-dashboard-light.png  -startTab dashboard
          shot 3-settings-light.png   -startTab settings
          shot 4-filter-low-light.png -startFilter low

          xcrun simctl ui "$UDID" appearance dark
          sleep 2
          shot 5-inventory-dark.png
          shot 6-dashboard-dark.png -startTab dashboard

      - name: Сохранить скриншоты в репозиторий
        run: |
          set -e
          # Полноразмерные снимки весят по 2-3 МБ — в репозитории это лишнее.
          sips -Z 1000 screenshots/*.png > /dev/null
          rm -rf docs/screenshots
          mkdir -p docs/screenshots
          cp screenshots/*.png docs/screenshots/

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "скриншоты не изменились"
            exit 0
          fi
          # [skip ci] — иначе пуш из workflow запустил бы его снова.
          git commit -m "Обновить скриншоты симулятора [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Выгрузить скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Выгрузить лог сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
