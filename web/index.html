<title>Склад Treaple</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ── Токены ─────────────────────────────────────────────────────────────
   Светлая палитра объявлена целиком на голом :root; тёмная переопределяет
   только значения. Ни один цвет не живёт исключительно внутри медиазапроса. */
:root{
  --canvas:#F4F3F1; --surface:#FFFFFF; --surface-alt:#F7F6F4; --surface-sunk:#EFEEEB;
  --line:#E5E2DD; --line-strong:#CBC7C0;
  --text:#16161A; --text-2:#6C6C76; --text-3:#9B9BA4;
  --accent:#2F3D9E; --accent-mark:#4453C8; --accent-wash:#EDEEF9; --on-accent:#FFFFFF;
  --ok:#15803D; --low:#9A6B00; --out:#9B9BA4; --danger:#C42020;
  --shadow-contact:rgba(0,0,0,.04); --shadow-ambient:rgba(0,0,0,.055);
  --shadow-contact-r:1.5px; --shadow-ambient-r:12px; --shadow-ambient-y:6px;
  --edge-top:rgba(255,255,255,.9); --edge-bottom:rgba(229,226,221,.8);
  --r-card:16px; --r-control:12px; --r-thumb:12px;
  --gutter:20px;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#0C0C10; --surface:#17171D; --surface-alt:#1F1F26; --surface-sunk:#101016;
    --line:#2A2A33; --line-strong:#3C3C46;
    --text:#F4F3F1; --text-2:#9E9EA9; --text-3:#6E6E79;
    --accent:#9AA5FF; --accent-mark:#8E9AF5; --accent-wash:#1B1D33; --on-accent:#10101A;
    --ok:#4ADE80; --low:#F5B93C; --out:#6E6E79; --danger:#FF6B60;
    --shadow-contact:rgba(0,0,0,.5); --shadow-ambient:rgba(0,0,0,.45);
    --shadow-ambient-r:9px; --shadow-ambient-y:5px;
    --edge-top:rgba(255,255,255,.09); --edge-bottom:rgba(255,255,255,.02);
  }
}
:root[data-theme="dark"]{
  --canvas:#0C0C10; --surface:#17171D; --surface-alt:#1F1F26; --surface-sunk:#101016;
  --line:#2A2A33; --line-strong:#3C3C46;
  --text:#F4F3F1; --text-2:#9E9EA9; --text-3:#6E6E79;
  --accent:#9AA5FF; --accent-mark:#8E9AF5; --accent-wash:#1B1D33; --on-accent:#10101A;
  --ok:#4ADE80; --low:#F5B93C; --out:#6E6E79; --danger:#FF6B60;
  --shadow-contact:rgba(0,0,0,.5); --shadow-ambient:rgba(0,0,0,.45);
  --shadow-ambient-r:9px; --shadow-ambient-y:5px;
  --edge-top:rgba(255,255,255,.09); --edge-bottom:rgba(255,255,255,.02);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--canvas); color:var(--text);
  font-family:var(--sans); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Цифры выстраиваются в колонку — это половина смысла складской таблицы. */
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

.micro{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}

/* ── Каркас ──────────────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100%;min-height:0}
.topbar{
  flex:0 0 auto;background:var(--canvas);
  padding:10px var(--gutter) 0;
  border-bottom:1px solid transparent;transition:border-color .2s;
}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar-row{display:flex;align-items:center;gap:12px;min-height:38px}
.brand{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0;flex:1 1 auto}
.iconbtn{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);
  flex:0 0 auto;transition:transform .12s,background .15s;
}
.iconbtn:hover{background:var(--surface-alt);color:var(--text)}
.iconbtn:active{transform:scale(.94)}
.iconbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.iconbtn svg{width:17px;height:17px;display:block}

.search{position:relative;margin-top:10px}
.search input{
  width:100%;padding:10px 14px 10px 36px;border-radius:var(--r-control);
  background:var(--surface);border:1px solid var(--line);font-size:14px;
}
.search input::placeholder{color:var(--text-3)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-3)}

.segment{display:flex;gap:2px;margin:10px 0;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r-control) + 3px)}
.segment button{
  position:relative;isolation:isolate;
  flex:1;padding:7px 4px;border-radius:var(--r-control);font-size:13px;font-weight:600;
  color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:6px;
  transition:color .15s;
}
.segment button .cnt{font-variant-numeric:tabular-nums;font-size:11px;font-weight:500;color:var(--text-3)}
.segment button[aria-pressed="true"]{color:var(--on-accent)}
.segment button[aria-pressed="true"] .cnt{color:var(--on-accent);opacity:.7}
.segment .thumb{position:absolute;inset:0;border-radius:var(--r-control);background:var(--seg-tint,var(--accent));z-index:-1}

/* ── Область прокрутки ───────────────────────────────────────────────── */
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 var(--gutter);padding-block-end:28px}
.pane{display:none}
.pane.active{display:block}

/* ── Секции списка ───────────────────────────────────────────────────── */
.sect{display:flex;align-items:center;gap:10px;padding:18px 4px 8px;width:100%;text-align:left}
.sect .rule{flex:1;height:1px;background:var(--line)}
.sect .chev{color:var(--text-3);transition:transform .2s;width:11px;height:11px}
.sect[aria-expanded="false"] .chev{transform:rotate(-90deg)}

/* ── Карточка товара ─────────────────────────────────────────────────── */
.card{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 13px;margin-bottom:8px;border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:0 1px var(--shadow-contact-r) var(--shadow-contact),
             0 var(--shadow-ambient-y) var(--shadow-ambient-r) var(--shadow-ambient);
  transition:transform .12s;overflow:hidden;
}
.card::after{
  content:"";position:absolute;inset:0;border-radius:var(--r-card);pointer-events:none;
  border:1px solid transparent;
  background:linear-gradient(var(--edge-top),var(--edge-bottom)) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.card:active{transform:scale(.99)}
.card .mark{position:absolute;left:0;top:0;bottom:0;width:3px}
.thumb{
  flex:0 0 auto;width:46px;height:46px;border-radius:var(--r-thumb);display:grid;place-items:center;
  background:var(--accent-wash);color:var(--accent);font-weight:600;font-size:17px;
  border:1px solid var(--line);overflow:hidden;
}
.thumb img{width:100%;height:100%;object-fit:cover}
.card .body{flex:1 1 auto;min-width:0}
.card .name{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0 0 2px;overflow-wrap:anywhere}
.card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.price{font-size:15px;font-weight:600}

/* Состояние остатка несут форма точки и текст; цвет только усиливает —
   зелёный и янтарный при протанопии неразличимы (проверено валидатором). */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.badge .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.badge.ok{color:var(--text-2)}
.badge.ok .dot{background:var(--ok)}
.badge.low{color:var(--low);padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--low) 12%,transparent);border:1px solid color-mix(in srgb,var(--low) 28%,transparent)}
.badge.low .dot{background:none;border:2px solid var(--low)}
.badge.out{color:var(--out);padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--out) 12%,transparent);border:1px solid color-mix(in srgb,var(--out) 28%,transparent)}
.badge.out .dot{background:none;border:2px solid var(--out);opacity:.55}

/* ── Дашборд ─────────────────────────────────────────────────────────── */
.panel{background:var(--surface);border-radius:var(--r-card);padding:16px;margin-bottom:10px;
  box-shadow:0 1px var(--shadow-contact-r) var(--shadow-contact),
             0 var(--shadow-ambient-y) var(--shadow-ambient-r) var(--shadow-ambient);
  position:relative}
.panel::after{content:"";position:absolute;inset:0;border-radius:var(--r-card);pointer-events:none;
  border:1px solid transparent;background:linear-gradient(var(--edge-top),var(--edge-bottom)) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.hero-figure{white-space:nowrap;font-size:38px;font-weight:600;letter-spacing:-.025em;line-height:1.1;margin:8px 0 6px}
.strip{display:flex;align-items:stretch}
.strip>div{flex:1;min-width:0}
.strip .vrule{flex:0 0 1px;background:var(--line);margin:2px 12px}
.strip .figure{white-space:nowrap;font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:5px}

/* Столбцы одного цвета: длина уже кодирует величину, второй канал был бы
   избыточен, а перекраска при смене порядка — прямая ошибка. */
.bars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.bar-row{display:grid;grid-template-columns:minmax(58px,26%) 1fr auto;align-items:center;gap:10px}
.bar-row .cat{font-size:12px;color:var(--text-2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:18px;border-radius:5px;background:var(--surface-sunk);overflow:hidden}
.bar-fill{height:100%;border-radius:5px;background:var(--accent-mark);transform-origin:left center;animation:grow .6s cubic-bezier(.2,.7,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar-row .val{font-variant-numeric:tabular-nums;font-size:12px;font-weight:500;color:var(--text-2);min-width:2.5ch;text-align:right}

.att-row{display:flex;align-items:center;gap:11px;padding:10px 0}
.att-row+.att-row{border-top:1px solid var(--line)}

/* ── Настройки ───────────────────────────────────────────────────────── */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:30px}
.row+.row{border-top:1px solid var(--line)}
.row .lbl{flex:1 1 auto;font-size:14px;color:var(--text-2)}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface-alt);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{width:32px;height:28px;display:grid;place-items:center;color:var(--accent)}
.stepper button:hover{background:var(--accent-wash)}
.stepper .v{min-width:38px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
.themes{display:flex;gap:8px;margin-top:8px}
.themes button{flex:1;padding:13px 6px;border-radius:var(--r-control);background:var(--surface);
  border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--text-2);
  display:flex;flex-direction:column;align-items:center;gap:7px}
.themes button[aria-pressed="true"]{background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent)}
.themes svg{width:17px;height:17px}
.linkrow{display:flex;align-items:center;gap:11px;padding:12px 0;width:100%;text-align:left;font-size:14px;font-weight:500;color:var(--accent)}
.linkrow+.linkrow{border-top:1px solid var(--line)}
.linkrow .sub{display:block;font-size:11px;font-weight:400;color:var(--text-3)}
.linkrow.danger{color:var(--danger)}

/* ── Нижние вкладки ──────────────────────────────────────────────────── */
.tabs{
  flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabs button{flex:1;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:500;color:var(--text-3);position:relative}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs svg{width:21px;height:21px}

/* ── Диалог ──────────────────────────────────────────────────────────── */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:rgba(10,10,14,.45);backdrop-filter:blur(3px)}
.sheet:focus{outline:none}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:94%;display:flex;flex-direction:column;
  background:var(--canvas);border-radius:20px 20px 0 0;overflow:hidden;
  box-shadow:0 -1px 0 var(--line),0 -20px 50px rgba(0,0,0,.22);
  animation:rise .28s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  .sheet{animation:none}
  .bar-fill{animation:none}
  *{scroll-behavior:auto}
}
.sheet-head{display:flex;align-items:center;gap:12px;padding:14px var(--gutter);border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-head h2{flex:1;margin:0;font-size:16px;font-weight:600;text-align:center}
.sheet-head button{font-size:14px;font-weight:600;color:var(--accent)}
.sheet-head button[disabled]{color:var(--text-3);cursor:not-allowed}
.sheet-body{overflow-y:auto;padding:16px var(--gutter);padding-block-end:calc(24px + env(safe-area-inset-bottom,0px))}

.field{display:flex;align-items:center;gap:12px;padding:11px 0}
.field+.field{border-top:1px solid var(--line)}
.field label{flex:0 0 auto;width:118px;font-size:13px;color:var(--text-2)}
.field .ctl{flex:1 1 auto;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.field input[type=text],.field input[type=number]{
  width:100%;text-align:right;padding:6px 9px;border-radius:8px;
  background:var(--surface-alt);border:1px solid var(--line);font-size:14px;
}
.field .unit{font-size:13px;color:var(--text-3);flex:0 0 auto}
.field.invalid input{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 6%,transparent)}
.err{font-size:12px;color:var(--danger);padding:0 0 9px 130px}

/* Полоса «закупка / прибыль» — главный инструмент карточки: наценка
   перестаёт быть абстрактным процентом и становится пропорцией. */
.split{margin:14px 0 4px}
.split-bar{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--surface-sunk)}
.split-bar i{display:block;transition:width .3s cubic-bezier(.2,.7,.3,1)}
.split-bar .cost{background:var(--text-3)}
.split-bar .gain{background:var(--accent-mark)}
.split-bar .loss{background:var(--danger)}
.split-legend{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--text-2)}
.split-legend b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.presets button{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent)}
.presets button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.swap{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent);margin-top:12px}
.swap svg{width:13px;height:13px}

.switch{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line-strong);transition:background .2s;flex:0 0 auto}
.switch[aria-checked="true"]{background:var(--ok)}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"] i{transform:translateX(18px)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{padding:11px 12px;border-radius:11px;background:var(--surface-alt);border:1px solid var(--line)}
.stat .v{font-size:16px;font-weight:600;margin-top:3px}

/* ── Пусто ───────────────────────────────────────────────────────────── */
.empty{text-align:center;padding:52px 18px}
.empty .ill{width:104px;height:104px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 8%,transparent);color:var(--accent)}
.empty .ill svg{width:34px;height:34px}
.empty h3{margin:0 0 7px;font-size:18px;font-weight:600;letter-spacing:-.02em}
.empty p{margin:0 auto 18px;max-width:34ch;color:var(--text-2);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 20px;border-radius:999px;
  background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:600}
.btn.ghost{background:none;color:var(--text-2);padding:9px 12px}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);
  background:var(--text);color:var(--canvas);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);padding:4px 9px;
  border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.sync .led{width:6px;height:6px;border-radius:50%;background:var(--text-3)}
.sync.live .led{background:var(--ok)}
.sync.local .led{background:var(--low)}

/* ── Широкий экран: список и сводка рядом ────────────────────────────── */
@media (min-width:900px){
  body{font-size:14px}
  .tabs{display:none}
  #app{max-width:1180px;margin:0 auto;width:100%}
  .topbar{padding-top:16px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:24px;align-items:start}
  .pane{display:block}
  #pane-settings{display:none}
  #pane-settings.active{display:block}
  .cols.hidden{display:none}
  .rail{position:sticky;top:0}
  .rail .micro{margin-bottom:6px;display:block}
  .sheet{position:relative;margin:auto;max-width:560px;border-radius:18px;max-height:88%}
  dialog{display:grid;place-items:center}
  dialog:not([open]){display:none}
}
</style>

<div id="app">
  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <h1 class="brand">Склад</h1>
      <span class="sync" id="sync"><i class="led"></i><span id="syncText">Загрузка</span></span>
      <button class="iconbtn" id="btnSort" title="Сортировка" aria-label="Сортировка">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4l-3 4M7 4l3 4M17 20V4M17 20l-3-4M17 20l3-4"/></svg>
      </button>
      <button class="iconbtn primary" id="btnAdd" title="Добавить товар" aria-label="Добавить товар">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Поиск по названию или категории" autocomplete="off" spellcheck="false">
    </div>
    <div class="segment" id="segment" role="group" aria-label="Фильтр по остатку"></div>
  </header>

  <div class="scroll" id="scroll">
    <div class="cols" id="cols">
      <section class="pane active" id="pane-stock" aria-label="Список товаров"></section>
      <aside class="rail"><section class="pane" id="pane-dash" aria-label="Сводка"></section></aside>
    </div>
    <section class="pane" id="pane-settings" aria-label="Настройки"></section>
  </div>

  <nav class="tabs" id="tabs" role="tablist"></nav>
</div>

<dialog id="editor"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ══ Данные ══════════════════════════════════════════════════════════════
   Модель повторяет SwiftData-схему iOS-версии, чтобы данные оставались
   переносимыми между приложением и вебом. */
const FILTERS = [
  {id:"all", title:"Все"},
  {id:"low", title:"Мало"},
  {id:"out", title:"Нет"}
];
const SORTS = [
  {id:"name",    title:"По названию"},
  {id:"price",   title:"По цене продажи"},
  {id:"qty",     title:"По остатку"},
  {id:"updated", title:"По дате обновления"}
];
const NO_CATEGORY = "Без категории";

const SAMPLE = [
  ["Кроссовки Air Zoom","Nike",6200,11900,14,4],
  ["Худи Essentials","Adidas",2800,5490,3,5],
  ["Футболка Basic","Adidas",700,1690,42,3],
  ["Рюкзак Classic","Herschel",3100,6900,0,3],
  ["Носки высокие, 3 пары","Nike",420,990,2,6],
  ["Куртка Windrunner","Nike",8400,15900,7,3],
  ["Кепка Logo","Herschel",900,2290,19,3],
  ["Термокружка 500 мл","Аксессуары",1150,2790,1,3]
];

const state = {
  products:[], tab:"stock", filter:"all", sort:"name", asc:true,
  query:"", collapsed:new Set(), threshold:3, theme:"system",
  db:null, downloads:null, ready:false
};

/* ══ Формат ═════════════════════════════════════════════════════════════ */
const nf = new Intl.NumberFormat("ru-RU");
const NBSP = "\u00A0";
const money = v => nf.format(Math.round(v)) + NBSP + "₽";
const compact = v => {
  const a = Math.abs(v);
  if (a >= 1e6) return (v/1e6).toFixed(1).replace(".",",") + NBSP + "млн" + NBSP + "₽";
  if (a >= 1e5) return nf.format(Math.round(v/1e3)) + NBSP + "тыс." + NBSP + "₽";
  return money(v);
};
const pct = (v,d=0) => (d ? v.toFixed(d).replace(".",",") : Math.round(v)) + NBSP + "%";
const qty = n => nf.format(n) + NBSP + "шт.";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseNum = s => {
  const t = String(s).replace(/\s| /g,"").replace(",",".");
  if (!t) return 0;
  const v = parseFloat(t);
  return Number.isFinite(v) ? v : 0;
};
const relative = ts => {
  const mins = Math.round((Date.now() - ts) / 60000);
  if (mins < 1) return "только что";
  if (mins < 60) return mins + " мин назад";
  const h = Math.round(mins/60);
  if (h < 24) return h + " ч назад";
  return new Date(ts).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
};

/* ══ Производные величины ═══════════════════════════════════════════════ */
const stockState = p => (!p.inStock || p.quantity <= 0) ? "out"
                      : (p.quantity <= Math.max(p.lowStockThreshold,0) ? "low" : "ok");
const markup = p => p.purchasePrice > 0 ? (p.salePrice - p.purchasePrice) / p.purchasePrice * 100 : 0;
const category = p => (p.category || "").trim() || NO_CATEGORY;
const STATE_TITLE = {ok:"В наличии", low:"Мало", out:"Нет в наличии"};

function totals(list){
  let purchase = 0, sale = 0, units = 0;
  for (const p of list){
    const q = Math.max(p.quantity,0);
    purchase += p.purchasePrice * q;
    sale += p.salePrice * q;
    units += q;
  }
  const profit = sale - purchase;
  return {purchase, sale, profit, units, margin: sale > 0 ? profit/sale*100 : 0, titles: list.length};
}

/* ══ Хранилище ══════════════════════════════════════════════════════════
   db синхронизируется между устройствами; localStorage — запасной путь,
   когда возможность недоступна в этом просмотре. */
const LS_KEY = "treaple.products.v1";
const LS_PREFS = "treaple.prefs.v1";

function loadPrefs(){
  try{
    const raw = localStorage.getItem(LS_PREFS);
    if (raw){
      const p = JSON.parse(raw);
      if (p.threshold) state.threshold = p.threshold;
      if (p.theme) state.theme = p.theme;
      if (p.sort) { state.sort = p.sort; state.asc = !!p.asc; }
    }
  }catch(e){ /* приватный режим или заблокированные данные сайта */ }
}
function savePrefs(){
  try{
    localStorage.setItem(LS_PREFS, JSON.stringify({
      threshold:state.threshold, theme:state.theme, sort:state.sort, asc:state.asc
    }));
  }catch(e){}
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state.products)); }catch(e){}
}

const uid = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function makeProduct(o){
  return {
    id:o.id || uid(),
    name:o.name || "", category:o.category || "",
    purchasePrice:+o.purchasePrice || 0, salePrice:+o.salePrice || 0,
    quantity:Math.max(0, Math.round(+o.quantity || 0)),
    lowStockThreshold:Math.max(0, Math.round(o.lowStockThreshold ?? state.threshold)),
    inStock:o.inStock !== false,
    createdAt:o.createdAt || Date.now(), updatedAt:o.updatedAt || Date.now()
  };
}

async function persist(product){
  product.updatedAt = Date.now();
  const i = state.products.findIndex(p => p.id === product.id);
  if (i >= 0) state.products[i] = product; else state.products.push(product);
  render();
  saveLocal();
  if (state.db){
    try{ await state.db.collection("products").doc(product.id).set(product); }
    catch(e){ setSync("local","Сохранено на устройстве"); }
  }
}
async function removeProduct(id){
  state.products = state.products.filter(p => p.id !== id);
  render(); saveLocal();
  if (state.db){
    try{ await state.db.collection("products").doc(id).delete(); }catch(e){}
  }
}
async function seedSamples(){
  const items = SAMPLE.map(([name,cat,pp,sp,q,th]) =>
    makeProduct({name, category:cat, purchasePrice:pp, salePrice:sp, quantity:q, lowStockThreshold:th, inStock:q>0}));
  state.products = state.products.concat(items);
  render(); saveLocal();
  if (state.db){
    for (const p of items){
      try{ await state.db.collection("products").doc(p.id).set(p); }catch(e){ break; }
    }
  }
  toast("Добавлено 8 демо-товаров");
}

function setSync(kind, text){
  const el = document.getElementById("sync");
  el.className = "sync" + (kind ? " " + kind : "");
  document.getElementById("syncText").textContent = text;
}

async function initStorage(){
  const local = loadLocal();
  if (local && local.length) state.products = local.map(makeProduct);

  const db = await (window.claude?.use?.("db") ?? Promise.resolve(null));
  state.db = db;

  if (!db){
    setSync("local","Только это устройство");
    state.ready = true;
    render();
    return;
  }
  try{
    db.collection("products").onSnapshot(snap => {
      state.products = snap.docs.map(d => makeProduct({id:d.id, ...d.data()}));
      state.ready = true;
      saveLocal();
      setSync("live","Синхронизировано");
      render();
    }, () => {
      setSync("local","Только это устройство");
      state.ready = true;
      render();
    });
  }catch(e){
    setSync("local","Только это устройство");
    state.ready = true;
    render();
  }
}

/* ══ Отбор и сортировка ═════════════════════════════════════════════════ */
function visible(){
  const q = state.query.trim().toLowerCase();
  return state.products.filter(p => {
    const st = stockState(p);
    if (state.filter === "low" && st !== "low") return false;
    if (state.filter === "out" && st !== "out") return false;
    if (q && !(p.name.toLowerCase().includes(q) || category(p).toLowerCase().includes(q))) return false;
    return true;
  });
}
function sortList(list){
  const dir = state.asc ? 1 : -1;
  const byName = (a,b) => a.name.localeCompare(b.name,"ru");
  return [...list].sort((a,b) => {
    switch(state.sort){
      case "price":   return (a.salePrice - b.salePrice || byName(a,b)) * dir;
      case "qty":     return (a.quantity - b.quantity || byName(a,b)) * dir;
      case "updated": return (a.updatedAt - b.updatedAt) * dir;
      default:        return byName(a,b) * dir;
    }
  });
}
function grouped(list){
  const map = new Map();
  for (const p of list){
    const c = category(p);
    if (!map.has(c)) map.set(c, []);
    map.get(c).push(p);
  }
  return [...map.entries()]
    .map(([title, items]) => ({title, items:sortList(items)}))
    .sort((a,b) => a.title === NO_CATEGORY ? 1 : b.title === NO_CATEGORY ? -1 : a.title.localeCompare(b.title,"ru"));
}
const countFor = id => state.products.filter(p =>
  id === "all" ? true : stockState(p) === id).length;

/* ══ Иконки ═════════════════════════════════════════════════════════════ */
const ICON = {
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5l1.6 2.4 2.8-.5.5 2.8 2.4 1.6-1.4 2.5 1.4 2.5-2.4 1.6-.5 2.8-2.8-.5L12 21.5l-1.6-2.4-2.8.5-.5-2.8-2.4-1.6L6.1 12 4.7 9.5l2.4-1.6.5-2.8 2.8.5z"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M11 18.6h2"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13M14 5l3 3-3 3M20 16H7M10 13l-3 3 3 3"/></svg>',
  table:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>',
  wand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l4 4L8 20l-4-4z"/><path d="M17 3v3M20.5 4.5l-2 2M21 9h-3"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.4v.2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>'
};

/* ══ Отрисовка ══════════════════════════════════════════════════════════ */
function render(){
  renderSegment();
  renderTabs();
  renderStock();
  renderDash();
  renderSettings();
  applyTab();
}

function renderSegment(){
  const seg = document.getElementById("segment");
  const tint = {all:"var(--accent)", low:"var(--low)", out:"var(--text-2)"};
  seg.innerHTML = FILTERS.map(f => {
    const on = state.filter === f.id;
    const n = countFor(f.id);
    return `<button data-filter="${f.id}" aria-pressed="${on}" style="isolation:isolate">
      ${on ? `<span class="thumb" style="--seg-tint:${tint[f.id]}"></span>` : ""}
      <span>${f.title}</span>${n ? `<span class="cnt num">${n}</span>` : ""}
    </button>`;
  }).join("");
}

function renderTabs(){
  const tabs = [["stock","Склад",ICON.box],["dash","Дашборд",ICON.chart],["settings","Настройки",ICON.gear]];
  document.getElementById("tabs").innerHTML = tabs.map(([id,label,icon]) =>
    `<button role="tab" data-tab="${id}" aria-selected="${state.tab===id}">${icon}<span>${label}</span></button>`
  ).join("");
}

function badge(p){
  const st = stockState(p);
  return `<span class="badge ${st}"><i class="dot"></i><span class="num">${st==="ok" ? qty(p.quantity) : (st==="out" ? "0 шт." : qty(p.quantity))}</span></span>`;
}

function cardHTML(p){
  const st = stockState(p);
  const mk = st === "ok" ? "" :
    `<i class="mark" style="background:linear-gradient(var(--${st}),color-mix(in srgb,var(--${st}) 40%,transparent))"></i>`;
  const m = markup(p);
  return `<button class="card" data-edit="${p.id}">
    ${mk}
    <span class="thumb">${esc((p.name || category(p)).slice(0,1).toUpperCase())}</span>
    <span class="body">
      <span class="name">${esc(p.name || "Без названия")}</span>
      <span class="meta">
        <span class="micro">${esc(category(p))}</span>
        ${m > 0 ? `<span class="num" style="font-size:11px;color:var(--text-3)">+${pct(m)}</span>` : ""}
      </span>
    </span>
    <span class="side">
      <span class="price num">${money(p.salePrice)}</span>
      ${badge(p)}
    </span>
  </button>`;
}

function renderStock(){
  const pane = document.getElementById("pane-stock");
  if (!state.ready){ pane.innerHTML = `<p style="padding:40px 0;text-align:center;color:var(--text-3)">Загрузка…</p>`; return; }

  if (!state.products.length){
    pane.innerHTML = `<div class="empty">
      <div class="ill">${ICON.box}</div>
      <h3>Пока нет товаров</h3>
      <p>Добавьте первую позицию — приложение посчитает закупку, продажу, наценку и прибыль за вас.</p>
      <button class="btn" data-act="add">Добавить товар</button>
      <div style="margin-top:10px"><button class="btn ghost" data-act="seed">Заполнить примерами</button></div>
    </div>`;
    return;
  }

  const list = visible();
  if (!list.length){
    const searching = state.query.trim().length > 0;
    pane.innerHTML = `<div class="empty">
      <div class="ill">${searching ? ICON.box : ICON.warn}</div>
      <h3>${searching ? "Ничего не найдено" : "В этом срезе пусто"}</h3>
      <p>${searching ? `По запросу «${esc(state.query)}» товаров нет. Проверьте написание.` : "Ни одна позиция не попадает под фильтр."}</p>
      ${state.filter !== "all" ? `<button class="btn" data-act="all">Показать все</button>` : ""}
    </div>`;
    return;
  }

  pane.innerHTML = grouped(list).map(g => {
    const open = !state.collapsed.has(g.title);
    const units = g.items.reduce((s,p) => s + Math.max(p.quantity,0), 0);
    return `<button class="sect" data-sect="${esc(g.title)}" aria-expanded="${open}">
        <span class="micro" style="color:var(--text-2)">${esc(g.title)}</span>
        <span class="num" style="font-size:11px;color:var(--text-3)">${qty(units)}</span>
        <span class="rule"></span>
        <span class="chev">${ICON.chev}</span>
      </button>
      ${open ? g.items.map(cardHTML).join("") : ""}`;
  }).join("");
}

function renderDash(){
  const pane = document.getElementById("pane-dash");
  if (!state.products.length){
    pane.innerHTML = `<div class="empty" style="padding:36px 12px">
      <div class="ill">${ICON.chart}</div>
      <h3>Считать пока нечего</h3>
      <p>Добавьте товары — здесь появятся суммы закупки и продажи, прибыль и маржа.</p>
    </div>`;
    return;
  }
  const t = totals(state.products);
  const cats = [...state.products.reduce((m,p) => {
    const c = category(p);
    m.set(c, (m.get(c) || 0) + Math.max(p.quantity,0));
    return m;
  }, new Map())].map(([title,value]) => ({title,value})).sort((a,b) => b.value - a.value);
  const top = cats.slice(0,6);
  const rest = cats.slice(6);
  if (rest.length) top.push({title:"Прочее", value:rest.reduce((s,c) => s + c.value, 0)});
  const max = Math.max(1, ...top.map(c => c.value));

  const att = state.products.filter(p => stockState(p) !== "ok")
    .sort((a,b) => a.quantity - b.quantity).slice(0,5);

  pane.innerHTML = `
  <div class="panel">
    <span class="micro">Потенциальная прибыль</span>
    <div class="hero-figure num" style="color:${t.profit >= 0 ? "var(--ok)" : "var(--danger)"}">${compact(t.profit)}</div>
    <div style="font-size:12px;color:var(--text-3)">если продать весь остаток — ${qty(t.units)}</div>
  </div>

  <div class="panel strip">
    <div><span class="micro">Закупка</span><div class="figure num">${compact(t.purchase)}</div></div>
    <div class="vrule"></div>
    <div><span class="micro">Продажа</span><div class="figure num">${compact(t.sale)}</div></div>
    <div class="vrule"></div>
    <div><span class="micro">Маржа</span><div class="figure num">${pct(t.margin)}</div></div>
  </div>

  <div class="panel">
    <span class="micro">Остатки по категориям, шт.</span>
    <div class="bars">
      ${top.map(c => `<div class="bar-row">
        <span class="cat" title="${esc(c.title)}">${esc(c.title)}</span>
        <span class="bar-track"><i class="bar-fill" style="width:${(c.value/max*100).toFixed(1)}%" title="${esc(c.title)}: ${qty(c.value)}"></i></span>
        <span class="val">${nf.format(c.value)}</span>
      </div>`).join("")}
    </div>
  </div>

  <div class="panel">
    <div style="display:flex;align-items:baseline;gap:8px">
      <span class="micro" style="flex:1">Требует внимания</span>
      ${att.length ? `<span class="num" style="font-size:11px;font-weight:600;color:var(--low);background:color-mix(in srgb,var(--low) 12%,transparent);padding:2px 7px;border-radius:999px">${att.length}</span>` : ""}
    </div>
    ${att.length ? att.map(p => `<div class="att-row">
        <span class="thumb" style="width:34px;height:34px;font-size:13px;border-radius:9px">${esc((p.name || "?").slice(0,1).toUpperCase())}</span>
        <span style="flex:1;min-width:0">
          <span style="display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>
          <span class="micro">${esc(category(p))}</span>
        </span>
        ${badge(p)}
      </div>`).join("")
      : `<div style="display:flex;align-items:center;gap:9px;padding-top:10px;color:var(--ok)">
           <span style="width:17px;height:17px;display:block">${ICON.check}</span>
           <span style="font-size:13px;font-weight:500;color:var(--text)">Все позиции в норме</span>
         </div>`}
  </div>`;
}

function renderSettings(){
  const pane = document.getElementById("pane-settings");
  const t = totals(state.products);
  const themes = [["system","Системная",ICON.phone],["light","Светлая",ICON.sun],["dark","Тёмная",ICON.moon]];
  pane.innerHTML = `
  <div style="padding-top:6px">
    <span class="micro">Склад</span>
    <div class="panel" style="margin-top:8px;padding:2px 16px">
      <div class="row">
        <span class="lbl">Порог «мало»</span>
        <div class="stepper">
          <button data-th="-1" aria-label="Уменьшить порог">−</button>
          <span class="v" id="thVal">${state.threshold}</span>
          <button data-th="1" aria-label="Увеличить порог">+</button>
        </div>
      </div>
      <div class="row">
        <span class="lbl">Позиций на складе</span>
        <span class="num" style="font-weight:600">${nf.format(t.titles)}</span>
      </div>
      <button class="linkrow" data-act="applyThreshold" style="border-top:1px solid var(--line)">
        <span style="width:17px;height:17px;display:block">${ICON.wand}</span>
        <span>Применить порог ко всем товарам<span class="sub">Заменит индивидуальные пороги на ${state.threshold} шт.</span></span>
      </button>
    </div>

    <span class="micro">Оформление</span>
    <div class="themes">
      ${themes.map(([id,label,icon]) =>
        `<button data-theme="${id}" aria-pressed="${state.theme===id}">${icon}<span>${label}</span></button>`).join("")}
    </div>

    <div style="margin-top:22px"><span class="micro">Данные</span></div>
    <div class="panel" style="margin-top:8px;padding:2px 16px">
      <button class="linkrow" data-act="csv">
        <span style="width:17px;height:17px;display:block">${ICON.table}</span>
        <span>Скачать CSV<span class="sub">${nf.format(t.titles)} позиций · Excel и Numbers</span></span>
      </button>
      <button class="linkrow" data-act="seed">
        <span style="width:17px;height:17px;display:block">${ICON.wand}</span>
        <span>Добавить демо-товары<span class="sub">8 позиций для знакомства</span></span>
      </button>
      <button class="linkrow danger" data-act="wipe">
        <span style="width:17px;height:17px;display:block">${ICON.trash}</span>
        <span>Удалить все товары<span class="sub">Действие нельзя отменить</span></span>
      </button>
    </div>

    <p style="text-align:center;color:var(--text-3);font-size:11px;margin:26px 0 0;line-height:1.6">
      Treaple · веб-версия<br>${state.db ? "Данные синхронизируются между вашими устройствами" : "Данные хранятся в этом браузере"}
    </p>
  </div>`;
}

function applyTab(){
  const wide = window.matchMedia("(min-width:900px)").matches;
  const cols = document.getElementById("cols");
  document.getElementById("pane-settings").classList.toggle("active", state.tab === "settings");
  if (wide){
    cols.classList.toggle("hidden", state.tab === "settings");
  } else {
    cols.classList.remove("hidden");
    document.getElementById("pane-stock").classList.toggle("active", state.tab === "stock");
    document.getElementById("pane-dash").classList.toggle("active", state.tab === "dash");
  }
  const showList = wide || state.tab === "stock";
  document.getElementById("q").parentElement.hidden = !showList;
  document.getElementById("segment").hidden = !showList;
  document.getElementById("btnSort").hidden = !showList;
  document.getElementById("btnAdd").hidden = state.tab === "settings" && !wide;
}

/* ══ Редактор ═══════════════════════════════════════════════════════════ */
let draft = null;

function openEditor(id){
  const src = id ? state.products.find(p => p.id === id) : null;
  draft = {
    id: src?.id || null,
    name: src?.name || "",
    category: src?.category || "",
    purchase: src ? String(src.purchasePrice || "") : "",
    sale: src ? String(src.salePrice || "") : "",
    markup: src && src.purchasePrice > 0 ? String(Math.round(markup(src))) : "",
    quantity: src ? String(src.quantity) : "1",
    threshold: src ? src.lowStockThreshold : state.threshold,
    inStock: src ? src.inStock : true,
    dir: src ? "toMarkup" : "toPrice",
    touched: false
  };
  drawEditor();
  const dlgEl = document.getElementById("editor");
  dlgEl.showModal();
  dlgEl.querySelector(".sheet")?.focus({preventScroll:true});
}

function editorErrors(){
  const e = {};
  if (!draft.name.trim()) e.name = "Введите название товара";
  if (draft.quantity !== "" && !/^\d+$/.test(draft.quantity.trim())) e.quantity = "Введите целое число";
  return e;
}

function drawEditor(){
  const dlg = document.getElementById("editor");
  const errs = editorErrors();
  const show = k => draft.touched && errs[k];
  const pp = parseNum(draft.purchase), sp = parseNum(draft.sale);
  const profit = sp - pp;
  const cats = [...new Set(state.products.map(p => category(p)).filter(c => c !== NO_CATEGORY))]
    .filter(c => !draft.category.trim() || c.toLowerCase().includes(draft.category.trim().toLowerCase()))
    .slice(0,6);

  const costShare = sp > 0 ? Math.min(100, pp/sp*100) : (pp > 0 ? 100 : 0);
  const gainShare = Math.max(0, 100 - costShare);

  dlg.innerHTML = `<form method="dialog" class="sheet" tabindex="-1">
    <div class="sheet-head">
      <button value="cancel" type="submit">Отмена</button>
      <h2>${draft.id ? "Товар" : "Новый товар"}</h2>
      <button type="button" data-act="save" ${Object.keys(errs).length ? "disabled" : ""}>Сохранить</button>
    </div>
    <div class="sheet-body">
      <div class="panel" style="padding:2px 14px">
        <div class="field ${show("name") ? "invalid" : ""}">
          <label for="f-name">Название</label>
          <span class="ctl"><input id="f-name" type="text" value="${esc(draft.name)}" placeholder="Кроссовки Air Zoom" data-k="name"></span>
        </div>
        ${show("name") ? `<div class="err">${errs.name}</div>` : ""}
        <div class="field">
          <label for="f-cat">Категория</label>
          <span class="ctl"><input id="f-cat" type="text" value="${esc(draft.category)}" placeholder="Бренд или группа" data-k="category"></span>
        </div>
        ${cats.length ? `<div style="padding:0 0 11px"><div class="presets">${cats.map(c =>
          `<button type="button" data-cat="${esc(c)}" style="background:var(--surface-alt);color:var(--text-2)">${esc(c)}</button>`).join("")}</div></div>` : ""}
      </div>

      <div style="margin-top:16px"><span class="micro">Цены</span></div>
      <div class="panel" style="margin-top:8px;padding:2px 14px">
        <div class="field">
          <label for="f-pp">Цена закупки</label>
          <span class="ctl"><input id="f-pp" class="num" type="text" inputmode="decimal" value="${esc(draft.purchase)}" placeholder="0" data-k="purchase"><span class="unit">₽</span></span>
        </div>
        <div class="field">
          <label for="f-mk">Наценка</label>
          <span class="ctl"><input id="f-mk" class="num" type="text" inputmode="decimal" value="${esc(draft.markup)}" placeholder="0" data-k="markup" ${draft.dir === "toMarkup" ? "readonly style=opacity:.6" : ""}><span class="unit">%</span></span>
        </div>
        <div class="field">
          <label for="f-sp">Цена продажи</label>
          <span class="ctl"><input id="f-sp" class="num" type="text" inputmode="decimal" value="${esc(draft.sale)}" placeholder="0" data-k="sale" ${draft.dir === "toPrice" ? "readonly style=opacity:.6" : ""}><span class="unit">₽</span></span>
        </div>

        <div class="split">
          <div class="split-bar" aria-hidden="true">
            <i class="cost" style="width:${costShare}%"></i>
            <i class="${profit >= 0 ? "gain" : "loss"}" style="width:${gainShare}%"></i>
          </div>
          <div class="split-legend">
            <span>Закупка <b class="num">${money(pp)}</b></span>
            <span style="color:${profit >= 0 ? "var(--text-2)" : "var(--danger)"}">${profit >= 0 ? "Прибыль" : "Убыток"} <b class="num" style="${profit < 0 ? "color:var(--danger)" : ""}">${money(Math.abs(profit))}</b></span>
          </div>
        </div>

        <button type="button" class="swap" data-act="swap">
          ${ICON.swap}${draft.dir === "toPrice" ? "Наценка → цена" : "Цена → наценка"}
        </button>

        <div class="presets" style="padding-bottom:12px">
          ${[20,30,50,100,150].map(v =>
            `<button type="button" data-preset="${v}" aria-pressed="${draft.dir==="toPrice" && Math.round(parseNum(draft.markup))===v}">+${v} %</button>`).join("")}
        </div>
      </div>

      <div style="margin-top:16px"><span class="micro">Остаток</span></div>
      <div class="panel" style="margin-top:8px;padding:2px 14px">
        <div class="field ${show("quantity") ? "invalid" : ""}">
          <label for="f-qty">Количество</label>
          <span class="ctl">
            <input id="f-qty" class="num" type="text" inputmode="numeric" value="${esc(draft.quantity)}" placeholder="0" data-k="quantity" style="max-width:76px">
            <span class="stepper"><button type="button" data-qty="-1" aria-label="Минус один">−</button><button type="button" data-qty="1" aria-label="Плюс один">+</button></span>
          </span>
        </div>
        ${show("quantity") ? `<div class="err">${errs.quantity}</div>` : ""}
        <div class="field">
          <label>Порог «мало»</label>
          <span class="ctl"><span class="stepper">
            <button type="button" data-dth="-1" aria-label="Уменьшить порог">−</button>
            <span class="v">${draft.threshold}</span>
            <button type="button" data-dth="1" aria-label="Увеличить порог">+</button>
          </span></span>
        </div>
        <div class="field">
          <label id="lbl-instock">В наличии</label>
          <span class="ctl"><button type="button" class="switch" role="switch" aria-checked="${draft.inStock}" aria-labelledby="lbl-instock" data-act="stock"><i></i></button></span>
        </div>
      </div>

      ${draft.id ? `<button type="button" class="btn ghost" data-act="delete" style="color:var(--danger);margin-top:18px;width:100%;justify-content:center">
        <span style="width:16px;height:16px;display:block">${ICON.trash}</span>Удалить товар</button>` : ""}
    </div>
  </form>`;
}

function recalc(){
  const pp = parseNum(draft.purchase);
  if (draft.dir === "toPrice"){
    if (pp > 0 && draft.markup !== ""){
      const v = pp * (1 + parseNum(draft.markup)/100);
      draft.sale = String(Math.round(v * 100) / 100).replace(".",",");
    }
  } else {
    if (pp > 0 && draft.sale !== ""){
      draft.markup = String(Math.round((parseNum(draft.sale) - pp) / pp * 1000) / 10).replace(".",",");
    } else if (draft.sale === ""){
      draft.markup = "";
    }
  }
}

function saveDraft(){
  draft.touched = true;
  if (Object.keys(editorErrors()).length){ drawEditor(); return; }
  const q = Math.max(0, Math.round(parseNum(draft.quantity)));
  const p = makeProduct({
    id: draft.id || undefined,
    name: draft.name.trim(), category: draft.category.trim(),
    purchasePrice: Math.max(0, parseNum(draft.purchase)),
    salePrice: Math.max(0, parseNum(draft.sale)),
    quantity: q, lowStockThreshold: draft.threshold,
    inStock: q > 0 ? draft.inStock : false,
    createdAt: draft.id ? state.products.find(x => x.id === draft.id)?.createdAt : Date.now()
  });
  persist(p);
  document.getElementById("editor").close();
  toast(draft.id ? "Изменения сохранены" : "Товар добавлен");
}

/* ══ CSV ════════════════════════════════════════════════════════════════
   Точка с запятой и BOM: Excel в русской локали иначе ломает и колонки,
   и кириллицу. */
function csvText(){
  const head = ["Название","Категория","Цена закупки","Цена продажи","Наценка, %","Количество",
                "Сумма закупки","Сумма продажи","Прибыль","Порог «мало»","В наличии","Обновлено"];
  const cell = v => {
    const s = String(v);
    return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const dec = v => v.toFixed(2).replace(".",",");
  const rows = [...state.products]
    .sort((a,b) => category(a).localeCompare(category(b),"ru") || a.name.localeCompare(b.name,"ru"))
    .map(p => [p.name, category(p), dec(p.purchasePrice), dec(p.salePrice), dec(markup(p)),
               p.quantity, dec(p.purchasePrice*p.quantity), dec(p.salePrice*p.quantity),
               dec((p.salePrice-p.purchasePrice)*p.quantity), p.lowStockThreshold,
               p.inStock ? "да" : "нет", new Date(p.updatedAt).toISOString()]);
  return [head, ...rows].map(r => r.map(cell).join(";")).join("\r\n");
}

async function exportCSV(){
  if (!state.products.length){ toast("Сначала добавьте товары"); return; }
  const dl = state.downloads ?? await (window.claude?.use?.("downloads") ?? Promise.resolve(null));
  state.downloads = dl;
  if (!dl){ toast("Скачивание недоступно в этом просмотре"); return; }
  const stamp = new Date().toISOString().slice(0,10);
  try{
    await dl.save({filename:`Склад-${stamp}.csv`, data:"﻿" + csvText()});
    toast("Файл сохранён");
  }catch(e){
    toast("Сохранение отменено");
  }
}

/* ══ Мелочи ═════════════════════════════════════════════════════════════ */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}
function applyTheme(){
  const root = document.documentElement;
  if (state.theme === "system") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", state.theme);
}

/* ══ События ════════════════════════════════════════════════════════════ */
document.getElementById("q").addEventListener("input", e => {
  state.query = e.target.value;
  renderStock();
});

document.getElementById("scroll").addEventListener("scroll", e => {
  document.getElementById("topbar").classList.toggle("scrolled", e.target.scrollTop > 4);
}, {passive:true});

document.getElementById("btnAdd").addEventListener("click", () => openEditor(null));

document.getElementById("btnSort").addEventListener("click", () => {
  const i = SORTS.findIndex(s => s.id === state.sort);
  if (state.asc && state.sort !== "name"){ state.asc = false; }
  else if (!state.asc){ state.sort = SORTS[(i+1) % SORTS.length].id; state.asc = state.sort === "name"; }
  else { state.sort = SORTS[(i+1) % SORTS.length].id; state.asc = state.sort === "name"; }
  savePrefs();
  renderStock();
  const s = SORTS.find(s => s.id === state.sort);
  toast(s.title + (state.asc ? " ↑" : " ↓"));
});

document.getElementById("segment").addEventListener("click", e => {
  const b = e.target.closest("[data-filter]");
  if (!b) return;
  state.filter = b.dataset.filter;
  renderSegment(); renderStock();
});

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]");
  if (!b) return;
  state.tab = b.dataset.tab;
  renderTabs(); applyTab();
  document.getElementById("scroll").scrollTop = 0;
});

document.getElementById("scroll").addEventListener("click", e => {
  const card = e.target.closest("[data-edit]");
  if (card){ openEditor(card.dataset.edit); return; }

  const sect = e.target.closest("[data-sect]");
  if (sect){
    const k = sect.dataset.sect;
    state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k);
    renderStock();
    return;
  }

  const th = e.target.closest("[data-th]");
  if (th){
    state.threshold = Math.max(0, Math.min(999, state.threshold + (+th.dataset.th)));
    savePrefs(); renderSettings();
    return;
  }

  const theme = e.target.closest("[data-theme]");
  if (theme){
    state.theme = theme.dataset.theme;
    applyTheme(); savePrefs(); renderSettings();
    return;
  }

  const act = e.target.closest("[data-act]")?.dataset.act;
  if (!act) return;
  if (act === "add") openEditor(null);
  if (act === "seed") seedSamples();
  if (act === "all"){ state.filter = "all"; renderSegment(); renderStock(); }
  if (act === "csv") exportCSV();
  if (act === "applyThreshold"){
    state.products.forEach(p => { p.lowStockThreshold = state.threshold; });
    state.products.forEach(p => persist(p));
    toast("Порог применён ко всем товарам");
  }
  if (act === "wipe"){
    if (confirm("Удалить все товары? Действие нельзя отменить.")){
      const ids = state.products.map(p => p.id);
      state.products = [];
      render(); saveLocal();
      if (state.db) ids.forEach(id => state.db.collection("products").doc(id).delete().catch(() => {}));
      toast("Склад очищен");
    }
  }
});

const dlg = document.getElementById("editor");
dlg.addEventListener("input", e => {
  const k = e.target.dataset.k;
  if (!k) return;
  draft[k] = e.target.value;
  if (k === "purchase" || k === "markup" || k === "sale") recalc();
  // Перерисовываем только зависимые части, чтобы не сбивать каретку.
  const pp = parseNum(draft.purchase), sp = parseNum(draft.sale);
  const profit = sp - pp;
  const costShare = sp > 0 ? Math.min(100, pp/sp*100) : (pp > 0 ? 100 : 0);
  const bar = dlg.querySelector(".split-bar");
  if (bar){
    bar.children[0].style.width = costShare + "%";
    bar.children[1].style.width = Math.max(0, 100 - costShare) + "%";
    bar.children[1].className = profit >= 0 ? "gain" : "loss";
    const lg = dlg.querySelectorAll(".split-legend b");
    lg[0].textContent = money(pp);
    lg[1].textContent = money(Math.abs(profit));
    lg[1].parentElement.firstChild.textContent = (profit >= 0 ? "Прибыль " : "Убыток ");
  }
  if (k === "purchase" || k === "markup"){
    const f = dlg.querySelector('[data-k="sale"]');
    if (f && document.activeElement !== f) f.value = draft.sale;
  }
  if (k === "purchase" || k === "sale"){
    const f = dlg.querySelector('[data-k="markup"]');
    if (f && document.activeElement !== f) f.value = draft.markup;
  }
  const save = dlg.querySelector('[data-act="save"]');
  if (save) save.disabled = Object.keys(editorErrors()).length > 0;
});

dlg.addEventListener("click", e => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "save"){ saveDraft(); return; }
  if (act === "swap"){ draft.dir = draft.dir === "toPrice" ? "toMarkup" : "toPrice"; recalc(); drawEditor(); return; }
  if (act === "stock"){ draft.inStock = !draft.inStock; drawEditor(); return; }
  if (act === "delete"){
    if (confirm("Удалить «" + (draft.name || "товар") + "»?")){
      removeProduct(draft.id);
      dlg.close();
      toast("Товар удалён");
    }
    return;
  }
  const preset = e.target.closest("[data-preset]");
  if (preset){ draft.dir = "toPrice"; draft.markup = preset.dataset.preset; recalc(); drawEditor(); return; }
  const cat = e.target.closest("[data-cat]");
  if (cat){ draft.category = cat.dataset.cat; drawEditor(); return; }
  const q = e.target.closest("[data-qty]");
  if (q){
    draft.quantity = String(Math.max(0, Math.round(parseNum(draft.quantity)) + (+q.dataset.qty)));
    drawEditor();
    return;
  }
  const dth = e.target.closest("[data-dth]");
  if (dth){ draft.threshold = Math.max(0, Math.min(999, draft.threshold + (+dth.dataset.dth))); drawEditor(); }
});

window.matchMedia("(min-width:900px)").addEventListener("change", applyTab);

/* ══ Старт ══════════════════════════════════════════════════════════════ */
loadPrefs();
applyTheme();
render();
initStorage();
</script>
